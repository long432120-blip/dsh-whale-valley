  <path d="M40 470q4 -40 52 -40q36 0 44 28l18 -14v40l-18 -10q-10 18 -44 18q-50 0 -52 -22z" fill="#5b7fd6"/>
  <path d="M46 476q40 12 88 0q-6 14 -44 14q-36 0 -44 -14z" fill="#e8f0ff"/>
  <circle cx="72" cy="456" r="4" fill="#1f2a4d"/>

  <!-- 門（熱區對齊這裡：x 79–92%、y 27–74%） -->
  <rect x="758" y="142" width="124" height="252" rx="6" fill="#9a6644"/>
  <rect x="768" y="152" width="104" height="242" rx="4" fill="#c98d5e"/>
  <rect x="782" y="170" width="76" height="86" rx="4" fill="none" stroke="#b07a52" stroke-width="5"/>
  <rect x="782" y="276" width="76" height="98" rx="4" fill="none" stroke="#b07a52" stroke-width="5"/>
  <circle cx="856" cy="286" r="7" fill="#ffd27a" stroke="#c99a3a" stroke-width="2"/>
  <circle cx="820" cy="212" r="22" fill="#eaf6ff" stroke="#fff" stroke-width="4"/>
  <path d="M806 214q10 -12 22 0q-12 10 -22 0zM828 214l9 -7v14z" fill="#5b7fd6"/>
  <rect x="772" y="398" width="96" height="14" rx="6" fill="#8fbf8a"/>
