  <rect x="604" y="104" width="96" height="72" rx="4" fill="#fff" stroke="#b9a3d0" stroke-width="5"/>
  <path d="M612 150q12 -14 24 0t24 0t24 0t12 -4v22h-84z" fill="#7cc4f0"/>
  <circle cx="676" cy="126" r="9" fill="#ffd27a"/>

