<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0fc"/><stop offset="1" stop-color="#ece0f5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c19c"/><stop offset="1" stop-color="#cfa27a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dbff"/><stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.35"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 牆與護牆板 -->
  <rect width="960" height="392" fill="url(#wall)"/>
  <rect y="300" width="960" height="88" fill="#e7d6f1"/>
  <rect y="296" width="960" height="6" fill="#d9c3e8"/>
  <g stroke="#dcc8ea" stroke-width="2">
    <path d="M60 310v70M180 310v70M300 310v70M420 310v70M540 310v70M660 310v70"/>
  </g>

  <!-- 地板 -->
  <rect y="388" width="960" height="152" fill="url(#floor)"/>
  <rect y="384" width="960" height="8" fill="#c7a6d9"/>
  <g stroke="#b98d66" stroke-width="2" opacity="0.55">
    <path d="M0 425h960M0 465h960M0 508h960"/>
    <path d="M140 392v33M410 392v33M690 392v33M60 425v40M300 425v40M560 425v40M840 425v40M200 465v43M470 465v43M760 465v43M110 508v32M380 508v32M640 508v32M900 508v32"/>
  </g>

  <!-- 窗戶與窗簾 -->
  <rect x="104" y="64" width="204" height="196" rx="10" fill="#fff"/>
  <rect x="116" y="76" width="180" height="172" rx="4" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="170" cy="130" rx="30" ry="12"/><ellipse cx="192" cy="122" rx="22" ry="12"/>
    <ellipse cx="250" cy="190" rx="22" ry="8"/>
  </g>
  <path d="M206 76v172M116 162h180" stroke="#fff" stroke-width="8"/>
  <path d="M92 52h228" stroke="#a88bc4" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 56c22 60 4 150 30 214h-30z" fill="#f4b8cf"/>
  <path d="M316 56c-22 60 -4 150 -30 214h30z" fill="#f4b8cf"/>

  <!-- 吊燈與光暈 -->
  <path d="M480 0v70" stroke="#8d78a8" stroke-width="3"/>
  <path d="M446 96a34 30 0 0 1 68 0z" fill="#ffd27a"/>
  <ellipse cx="480" cy="250" rx="190" ry="170" fill="url(#lamp)"/>

  <!-- 層架：魚缸與盆栽 -->
  <rect x="404" y="192" width="168" height="10" rx="3" fill="#b07a52"/>
  <path d="M420 202l10 18M556 202l-10 18" stroke="#b07a52" stroke-width="5"/>
  <circle cx="452" cy="166" r="28" fill="#cfeeff" stroke="#9ccbe8" stroke-width="3"/>
  <path d="M426 170q26 10 52 0v8q-26 22 -52 0z" fill="#7cc4f0" opacity="0.6"/>
  <path d="M446 168q8 -8 16 0q-8 8 -16 0zM462 168l7 -5v10z" fill="#ff9a6b"/>
