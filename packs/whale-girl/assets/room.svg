  <ellipse cx="400" cy="472" rx="210" ry="40" fill="#a9c8ef"/>
  <ellipse cx="400" cy="472" rx="176" ry="29" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 9" opacity="0.8"/>

