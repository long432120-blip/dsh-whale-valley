<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH 養成 Demo</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px;
      background: #eef1fb; font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #2b2f45; }
    #app { width: min(960px, 92vw); box-shadow: 0 10px 40px rgba(40, 60, 120, .18); border-radius: 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
    .bar button { border: 0; border-radius: 999px; padding: 6px 14px; background: #fff; color: #2b2f45; cursor: pointer;
      box-shadow: 0 1px 4px rgba(40, 60, 120, .15); font: inherit; }
    .bar button:hover { background: #e4ebff; }
    #status { margin-left: auto; opacity: .75; }
    .hint { font-size: 13px; opacity: .6; margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="bar">
    <button id="skip" type="button">⏩ 快轉 3 小時</button>
    <button id="reset" type="button">🗑 重置存檔</button>
    <span id="status">載入中…</span>
  </div>
  <p class="hint">點她說話；點門切換房間 / 花園。重新整理後會停在上次的場景（存檔在 LocalBridge 裡）。</p>
  <script type="module" src="./demo.js"></script>
</body>
</html>
