<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鯨魚谷物語</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px;
      background: #2a2238; font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #f3e9ff; }
    #app { width: min(1320px, 96vw); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
    .bar button { border: 2px solid #6b3f22; border-radius: 6px; padding: 5px 12px; background: #fff3d6; color: #4a2b17;
      cursor: pointer; font: inherit; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
    .bar button:hover { background: #ffe6bd; }
    .bar button:active { translate: 0 2px; box-shadow: 0 1px 0 rgba(0,0,0,.35); }
    #status { flex-basis: 100%; opacity: .8; min-height: 1.4em; } /* 自己佔一行：文字變長也不會把畫面擠得跳動 */
    .hint { font-size: 13px; opacity: .65; margin: 0; }
    .dev-only[hidden] { display: none; }
    .game-title { margin: 0; font-size: 22px; letter-spacing: 2px; color: #ffe6b0; }
    .game-title small { font-size: 13px; opacity: .7; letter-spacing: 1px; margin-left: 6px; }
  </style>
</head>
<body>
  <h1 class="game-title">🐋 鯨魚谷物語<small>試玩版</small></h1>
  <div id="app"></div>
  <div class="bar">
    <!-- 開發者按鈕：網址加 ?dev 才會出現（例如 鯨魚谷物語.html?dev） -->
    <button id="skip" class="dev-only" type="button" hidden>⏩ 快轉 3 小時</button>
    <button id="day" class="dev-only" type="button" hidden>⏭ 跳到明天</button>
    <button id="away" class="dev-only" type="button" hidden>🚪 離開 3 小時再回來</button>
    <button id="reset" class="dev-only" type="button" hidden>🗑 重新開始</button>
    <span id="status">載入中…</span>
  </div>
  <p class="hint">點她說話；連點三下摸摸頭；點地面叫她走過去；點地圖邊緣的白色箭頭出門。
    🎒 揹包（B）、📖 圖鑑（C）、🗺️ 地圖（M）、🛠️ 裝修（R）、🎁 禮物碼（G）、🕹️ 自己走（P）、🔑 AI 對話（I）。
    遊戲時間跟現實同步，每 7 天換一季；每個動作都會自動存檔。</p>
  <script type="module" src="./pixel.js"></script>
</body>
</html>
